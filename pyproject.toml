# pyproject.toml at repo root
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = {text = "MIT"}
name = "deeprm"
version = "0.1.0"
description = "DeepRM – post‑processing & QC for Nanopore m6A detection"
keywords = ["RNA", "RNA modification", "m6A", "nanopore", "bioinformatics", "deep learning"]
authors = [{name = "Laboratory of Computational Biology, Seoul National University"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "colorama",
    "tqdm",
    "psutil",
    "networkx>=3.1",
    "numpy>=2.0,<3.0",
    "pandas>=2.0",
    "polyleven>=0.8",
    "pod5>=0.3.2",
    "pysam>=0.22.0",
    "torch>=2.4.0",
    "torchmetrics>=1.3.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7,<8",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "sphinx-autosummary-accessors",
]

# --- expose the CLI ---
[project.scripts]
deeprm = "deeprm.cli:main"
# ^^^^^  executable     module.function

[tool.setuptools.package-data]
"deeprm" = ["*.png", "*.json"]   # ship any data files you need

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["deeprm*"]
