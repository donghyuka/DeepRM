version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
python:
  install:
    - requirements: requirements.txt          # project runtime deps
    - method: pip
      path: .
    - method: pip                             # doc‑only deps
      requirements: docs/requirements-doc.txt
sphinx:
  configuration: docs/source/conf.py          # relative path to conf.py