name: Publish to PyPI on Release

on:
  release:
    types: [published]   # runs when you click "Publish release"
  workflow_dispatch:

jobs:
  build:
    name: Build sdist & wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ensure tags/history for tools like setuptools-scm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build backend
        run: python -m pip install --upgrade build
      - name: Build (PEP 517 using pyproject.toml)
        run: python -m build
      - name: Twine check (sanity)
        run: python -m pip install --upgrade twine && twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deeprm   # optional but nice in the UI
    permissions:
      id-token: write   # REQUIRED for Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # With Trusted Publishing, no username/password are needed.
        # (PEP 740 attestations are uploaded by default.)
